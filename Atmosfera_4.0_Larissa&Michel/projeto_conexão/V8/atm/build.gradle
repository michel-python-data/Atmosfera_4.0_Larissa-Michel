plugins {
    id 'java'
    id 'application' // Adiciona o suporte para a tarefa 'run' no Gradle
}

group = 'org.example'
version = '1.0-SNAPSHOT'

// Define a classe principal do projeto que será executada com ./gradlew run
application {
    mainClass = 'org.example.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    // Servidor Web leve Javalin e suporte de logs
    implementation 'io.javalin:javalin:5.6.3'
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    // Serializador JSON Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    // Driver do MySQL
    implementation 'com.mysql:mysql-connector-j:8.4.0'

    // Dependências de Testes Unitários (JUnit 5)
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Geração de relatórios em PDF
    implementation 'com.github.librepdf:openpdf:1.3.39'
}

test {
    useJUnitPlatform()
}